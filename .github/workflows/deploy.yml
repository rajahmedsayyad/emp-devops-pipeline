name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOCKER_USER: sayyadrajahmed
  BACKEND_IMAGE: sayyadrajahmed/emp-backend
  FRONTEND_IMAGE: sayyadrajahmed/emp-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes Cluster
        run: |
          kubectl apply -f ./k8s/k8s.yaml
          kubectl rollout restart deployment/backend
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/db --timeout=90s
          kubectl rollout status deployment/backend --timeout=90s
          kubectl rollout status deployment/frontend --timeout=90s

      - name: Verify Deployment Health
        run: |
          kubectl get pods -o wide
          kubectl get svc,ingress

